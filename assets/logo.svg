<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M100,20 C145,20 175,35 175,80 C175,130 135,168 100,185 C65,168 25,130 25,80 C25,35 55,20 100,20 Z" 
        fill="url(#primaryGrad)" filter="url(#shadow)" stroke="#2563EB" stroke-width="2"/>

  <!-- Academic Crest / Book Structure -->
  <path d="M100,75 L62,94 L62,130 Q100,145 100,145 Q100,145 138,130 L138,94 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M100,75 L100,145" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AI Spark / Knowledge Node -->
  <circle cx="100" cy="55" r="7" fill="url(#accentGrad)"/>
  <path d="M100,42 L100,48 M100,62 L100,68 M87,55 L93,55 M107,55 L113,55" 
        stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Orbital Rings representing RAG retrieval loops -->
  <ellipse cx="100" cy="110" rx="48" ry="18" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-dasharray="4,4"/>
  <circle cx="145" cy="115" r="3.5" fill="#93C5FD" />
  <circle cx="55" cy="105" r="3.5" fill="#93C5FD" />
</svg>
